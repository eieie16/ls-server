<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兑换码 - 凌云城</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-hero{
      min-height:50vh;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;text-align:center;
      padding:7rem 1.5rem 3rem;
    }
    .page-hero-bg{
      position:absolute;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 20%,rgba(212,168,83,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 75% 70%,rgba(94,234,212,0.04) 0%,transparent 50%);
    }
    .page-hero-content{position:relative;z-index:2;max-width:700px}
    .page-hero h1{
      font-family:var(--font-display);font-size:clamp(2.4rem,6vw,4.2rem);
      line-height:1.15;margin-bottom:1rem;
      animation:fadeUp .8s ease .1s both;
    }
    .page-hero h1 .line1{
      display:block;
      background:linear-gradient(135deg,#fff 20%,var(--text2));
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .page-hero h1 .line2{
      display:block;position:relative;
      background:linear-gradient(135deg,var(--gold),var(--gold2),#fff,var(--gold));
      background-size:300% 300%;
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:shimmer 5s ease infinite;
    }
    .page-hero h1 .line2::after{
      content:'';position:absolute;bottom:-6px;left:15%;right:15%;height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35;
    }
    .page-hero p{
      font-size:clamp(.88rem,1.6vw,1.05rem);color:var(--text2);
      line-height:1.8;max-width:480px;margin-inline:auto;
      animation:fadeUp .8s ease .25s both;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:translateY(0)}
    }

    .redeem-section{
      max-width:560px;margin:0 auto;
      padding:0 clamp(1rem,4vw,4rem) clamp(3rem,6vh,5rem);
    }
    .redeem-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;
      position:relative;overflow:hidden;
    }
    .redeem-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,83,0.3),transparent);
    }
    .redeem-icon{font-size:3rem;margin-bottom:1rem;display:block}
    .redeem-card h2{
      font-family:var(--font-heading);font-size:1.3rem;font-weight:700;
      margin-bottom:.4rem;
    }
    .redeem-card .desc{font-size:.88rem;color:var(--text2);margin-bottom:2rem}

    .input-group{display:flex;gap:.5rem;margin-bottom:1.5rem}
    .input-group input{
      flex:1;padding:.75rem 1rem;background:var(--bg2);
      border:1px solid var(--border);border-radius:10px;font-size:1rem;
      color:var(--text);letter-spacing:.06em;font-family:var(--font-body);
      transition:border-color .2s;
    }
    .input-group input:focus{outline:none;border-color:var(--gold)}
    .input-group input::placeholder{color:var(--text3);letter-spacing:0}

    .btn-redeem{
      width:100%;padding:.85rem;background:var(--gold);color:#000;
      border:none;border-radius:10px;font-size:.95rem;font-weight:600;
      cursor:pointer;transition:all .25s;font-family:var(--font-body);
      position:relative;overflow:hidden;
    }
    .btn-redeem:hover{background:var(--gold2);box-shadow:0 4px 20px rgba(212,168,83,0.35);transform:translateY(-1px)}
    .btn-redeem:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-redeem .spinner{
      display:none;width:18px;height:18px;
      border:2px solid rgba(0,0,0,0.2);border-top-color:#000;
      border-radius:50%;animation:spin .6s linear infinite;margin:0 auto;
    }
    .btn-redeem.loading .btn-text{display:none}
    .btn-redeem.loading .spinner{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}

    .result{
      margin-top:1.5rem;padding:1.25rem;border-radius:10px;
      display:none;text-align:left;
    }
    .result.show{display:block}
    .result.success{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2)}
    .result.error{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2)}
    .result h3{font-size:.95rem;font-weight:600;margin-bottom:.5rem}
    .result.success h3{color:#34d399}
    .result.error h3{color:var(--red)}
    .result .prize{
      font-size:1.05rem;font-weight:700;color:var(--gold);
      background:var(--gold-dim);padding:.5rem .75rem;border-radius:8px;
      display:inline-block;margin-top:.25rem;word-break:break-all;
      user-select:all;cursor:pointer;
    }
    .result .prize-hint{font-size:.78rem;color:var(--text3);margin-top:.5rem}

    .my-redemptions{
      margin-top:1.5rem;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius);
      padding:1.5rem 2rem;overflow:hidden;
    }
    .my-redemptions h2{
      font-size:1rem;font-weight:600;margin-bottom:1rem;
      display:flex;align-items:center;gap:.5rem;
    }
    .redemption-list{list-style:none}
    .redemption-item{
      display:flex;align-items:center;gap:.85rem;
      padding:.7rem 0;border-bottom:1px solid var(--border);
    }
    .redemption-item:last-child{border-bottom:none}
    .redemption-item .r-icon{
      width:36px;height:36px;border-radius:8px;
      background:var(--gold-dim);border:1px solid rgba(212,168,83,0.1);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;font-size:1rem;
    }
    .redemption-item .r-info{flex:1;min-width:0}
    .redemption-item .r-code{
      font-size:.82rem;font-weight:600;color:var(--text);
      font-family:'SF Mono',Consolas,monospace;letter-spacing:.04em;
    }
    .redemption-item .r-prize{
      font-size:.78rem;color:var(--gold);background:var(--gold-dim);
      padding:.1rem .4rem;border-radius:4px;display:inline-block;
      margin-top:.15rem;max-width:220px;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap;
    }
    .redemption-item .r-time{font-size:.72rem;color:var(--text3);margin-top:.15rem}
    .empty{text-align:center;padding:2rem;color:var(--text3);font-size:.88rem}

    @media(max-width:600px){
      .redeem-card{padding:2rem 1.25rem}
      .my-redemptions{padding:1.25rem}
    }
  </style>
</head>
<body>

    <button class="nav-toggle" id="navToggle" onclick="toggleNav()">
      <span></span><span></span><span></span>

  <section class="page-hero">
    <div class="page-hero-bg"></div>
    <div class="page-hero-content">
      <h1>
        <span class="line1">输入兑换码</span>

      <p>输入你获得的兑换码，领取专属奖励物品</p>
    </div>
  </section>

  <section class="redeem-section">
    <div class="redeem-card">
      <span class="redeem-icon">🎁</span>
      <h2>兑换码兑换</h2>
      <p class="desc">输入你获得的兑换码，领取专属奖励</p>
      <div class="input-group">
        <input type="text" id="redeemInput" placeholder="请输入兑换码" autocomplete="off">
      </div>
      <button class="btn-redeem" id="redeemBtn" onclick="handleRedeem()">

  <script src="supabase.min.js"></script>
  <script src="utils.js"></script>
  <script>
    const SUPABASE_URL="https://mxajreukeniayoqyvybe.supabase.co";
    const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YWpyZXVrZW5pYXlvcXl2eWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTkyNDYsImV4cCI6MjEwMzQzNTI0Nn0.J3H9pFK2dc3KOLL8d64a7HEznm-fkJUNZN4YdMu5jD4";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    // 粒子系统
    (function(){
      const c=document.getElementById('particles-canvas');
      const ctx=c.getContext('2d');
      let w,h,particles=[];
      function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
      window.addEventListener('resize',resize);resize();
      class Particle{
        constructor(){this.reset()}
        reset(){
          this.x=Math.random()*w;this.y=Math.random()*h;
          this.size=Math.random()*1.5+.5;
          this.speedX=(Math.random()-.5)*.3;this.speedY=(Math.random()-.5)*.3;
          this.opacity=Math.random()*.4+.1;
          this.color=Math.random()>.7?'212,168,83':'255,255,255';
        }
        update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset()}
        draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.opacity})`;ctx.fill()}
      }
      for(let i=0;i<60;i++)particles.push(new Particle());
      function animate(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}
      animate();
    })();

    // 导航滚动
    window.addEventListener('scroll',()=>{
      document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>50);
    });
    function toggleNav(){
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navToggle').classList.toggle('open');
    }

    let currentUser=null;

    async function init(){
      try{
        const{data:{session}}=await supabaseClient.auth.getSession();
        const navAuth=document.getElementById('navAuth');
        if(session){
          currentUser=session;
          const{data:p}=await supabaseClient.from('profiles').select('avatar_url,username').eq('id',session.user.id).single();
          const name=(p&&p.username)||'玩家';
          const avatar=p&&p.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
          navAuth.innerHTML=`
            <a href="dashboard.html" class="user-badge"><div class="avatar">${avatar}</div><span>${name}</span></a>
            <a href="#" class="nav-btn outline" onclick="logout(event)">退出</a>`;
          loadMyRedemptions();
        }else{
          document.getElementById('redemptionList').innerHTML='<li class="empty">请先登录查看兑换记录</li>';
        }
      }catch(e){console.error('init error:',e)}
    }

    async function handleRedeem(){
      const code=document.getElementById('redeemInput').value.trim();
      const btn=document.getElementById('redeemBtn');
      const resultEl=document.getElementById('result');
      if(!code)return;

      btn.className='btn-redeem loading';
      resultEl.className='result';

      try{
        if(!currentUser){
          resultEl.className='result show error';
          resultEl.innerHTML='<h3>❌ 请先登录</h3><p style="font-size:.85rem;color:var(--text2)">登录后才能使用兑换码</p>';
          btn.className='btn-redeem';
          return;
        }

        const{data:codeData}=await supabaseClient.from('redemption_codes')
          .select('*').eq('code',code).single();

        if(!codeData){
          resultEl.className='result show error';
          resultEl.innerHTML='<h3>❌ 兑换码不存在</h3>';
          btn.className='btn-redeem';
          return;
        }

        if(codeData.used_count>=codeData.max_uses){
          resultEl.className='result show error';
          resultEl.innerHTML='<h3>❌ 兑换码已被使用完毕</h3>';
          btn.className='btn-redeem';
          return;
        }

        await supabaseClient.from('redemption_codes')
          .update({used_count:codeData.used_count+1}).eq('id',codeData.id);

        const prizeName=codeData.prize||'未知奖品';

        await supabaseClient.from('redeem_logs').insert([{
          user_id:currentUser.user.id,
          username:currentUser.user.email.split('@')[0],
          code:code,
          prize:prizeName
        }]);

        resultEl.className='result show success';
        resultEl.innerHTML=`
          <h3>✅ 兑换成功</h3>
          <div class="prize" onclick="navigator.clipboard.writeText('${prizeName.replace(/'/g,"\\'")}');this.textContent='已复制 ✓'">${prizeName}</div>
          <div class="prize-hint">点击奖品名称可复制</div>
        `;
        btn.className='btn-redeem';
        document.getElementById('redeemInput').value='';
        loadMyRedemptions();
      }catch(err){
        btn.className='btn-redeem';
        resultEl.className='result show error';
        resultEl.innerHTML='<h3>❌ 兑换失败</h3><p style="font-size:.85rem;color:var(--text2)">请稍后重试</p>';
        console.error(err);
      }
    }

    document.getElementById('redeemInput').addEventListener('keydown',e=>{
      if(e.key==='Enter')handleRedeem();
    });

    async function loadMyRedemptions(){
      if(!currentUser)return;
      try{
        const{data}=await supabaseClient.from('redeem_logs')
          .select('*').eq('user_id',currentUser.user.id)
          .order('created_at',{ascending:false}).limit(20);

        const list=document.getElementById('redemptionList');
        if(!data||data.length===0){
          list.innerHTML='<li class="empty">暂无兑换记录</li>';
          return;
        }
        list.innerHTML=data.map(r=>{
          const t=new Date(r.created_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
          return `<li class="redemption-item">
            <div class="r-icon">🎁</div>
            <div class="r-info">
              <div class="r-code">${r.code}</div>
              <div class="r-prize">${r.prize}</div>
              <div class="r-time">${t}</div>
            </div>
          </li>`;
        }).join('');
      }catch(e){
        console.error('load redemptions error:',e);
      }
    }

    async function logout(e){
      e.preventDefault();
      await supabaseClient.auth.signOut();
      location.reload();
    }

    init();
  </script>
  <script src="modal.js"></script>
  <script src="mobile-menu.js"></script>
</body>
</html>
