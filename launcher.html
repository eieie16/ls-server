<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动游戏 — 凌云城</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏯</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .launcher-wrap{
      min-height:100vh;display:flex;flex-direction:column;
      background:
        radial-gradient(ellipse 60% 50% at 50% 30%,rgba(212,168,83,0.05) 0%,transparent 70%),
        var(--bg);
    }
    .launcher-main{flex:1;display:flex;align-items:center;justify-content:center;padding:6rem 1.5rem 4rem}
    .launcher-box{text-align:center;max-width:480px;width:100%}
    .launcher-logo{
      font-family:var(--font-display);
      font-size:clamp(2rem,5vw,2.8rem);
      margin-bottom:2.5rem;
    }
    .launcher-status{
      display:flex;align-items:center;justify-content:center;gap:.8rem;
      margin-bottom:1.5rem;
    }
    .spinner{
      width:20px;height:20px;border:2px solid var(--border2);
      border-top-color:var(--gold);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .launcher-status span{color:var(--text2);font-size:.95rem}
    .ip-display{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:1.5rem;margin-bottom:1.2rem;
    }
    .ip-display label{display:block;font-size:.75rem;color:var(--text3);margin-bottom:.5rem;letter-spacing:.06em}
    .ip-display code{
      font-size:1.1rem;color:var(--gold);
      font-family:'SF Mono',Consolas,monospace;letter-spacing:.04em;
    }
    .launcher-note{font-size:.82rem;color:var(--text3);margin-bottom:1.5rem;line-height:1.6}
    .launcher-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
    #copyBtn{
      padding:.75rem 1.8rem;border-radius:8px;font-size:.88rem;font-weight:600;
      cursor:pointer;transition:all .25s;border:none;font-family:var(--font-body);
      background:var(--surface2);color:var(--text);
      border:1px solid var(--border2);
    }
    #copyBtn:hover{border-color:var(--gold);color:var(--gold)}
    #copyBtn.copied{border-color:#34d399;color:#34d399}
    .back-link{
      display:inline-flex;align-items:center;gap:.4rem;
      font-size:.85rem;color:var(--text3);transition:color .2s;
    }
    .back-link:hover{color:var(--gold)}
  </style>
</head>
<body>
  <div class="launcher-wrap">
    <nav class="nav" id="mainNav">
      <a href="index.html" class="nav-logo">凌云城</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li>
        <li><a href="features.html">特色</a></li>
        <li><a href="rules.html">规则</a></li>
        <li><a href="connect.html">加入</a></li>
        <li><a href="redeem.html">兑换</a></li>
        <li><a href="forum.html">论坛</a></li>
      <li><a href="gallery.html">画廊</a></li>
      </ul>
      <div class="nav-right">
        <a href="login.html" class="nav-btn outline">登录</a>
        <a href="login.html" class="nav-btn filled">注册</a>
      </div>
      <button class="nav-toggle" id="navToggle" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <div class="launcher-main">
      <div class="launcher-box">
        <div class="launcher-logo art-text">凌云城</div>
        <div class="launcher-status">
          <div class="spinner"></div>
          <span>正在启动游戏...</span>
        </div>
        <div class="ip-display">
          <label>服务器地址</label>
          <code>connect oaa5897</code>
        </div>
        <p class="launcher-note">如果游戏未启动，请手动复制地址</p>
        <div class="launcher-actions">
          <button id="copyBtn" onclick="copyIp()">复制连接地址</button>
          <a href="index.html" class="back-link">← 回到首页</a>
        </div>
      </div>
    </div>

    <footer class="footer" style="margin-top:auto">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="logo">凌云城</span>
          <p>优质的中文 FiveM 轻 RP 服务器，为你提供轻松愉快的角色扮演体验。</p>
        </div>
        <div class="footer-col">
          <h4>导航</h4>
          <ul>
            <li><a href="features.html">服务器特色</a></li>
            <li><a href="rules.html">服务器规则</a></li>
            <li><a href="connect.html">如何加入</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>社区</h4>
          <ul>
            <li><a href="https://kook.vip/71Hw5z" target="_blank">Kook</a></li>
            <li><a href="https://qm.qq.com/q/zzUzFa6ytw" target="_blank">QQ 群</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; 2026 凌云城-轻RP 4.0</span>
        <span>本站与 Rockstar Games 无任何关联</span>
      </div>
    </footer>
  </div>

  <script>
    var connectUrl = 'fivem://connect/oaa5897';

    function copyIp() {
      navigator.clipboard.writeText('connect oaa5897');
      var btn = document.getElementById('copyBtn');
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(function () {
        btn.textContent = '复制连接地址';
        btn.classList.remove('copied');
      }, 2000);
    }

    function toggleNav() {
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navToggle').classList.toggle('open');
    }

    window.addEventListener('scroll', function () {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 50);
    });

    (function () {
      var frame = document.createElement('iframe');
      frame.style.display = 'none';
      frame.src = connectUrl;
      document.body.appendChild(frame);

      setTimeout(function () {
        try { document.body.removeChild(frame); } catch (e) {}
      }, 3000);

      setTimeout(function () {
        window.location.href = connectUrl;
      }, 500);
    })();
  </script>
</body>
</html>
