  <script src="supabase.min.js"></script>
  <script src="utils.js"></script>
  <script>
    const SUPABASE_URL="https://mxajreukeniayoqyvybe.supabase.co";
    const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YWpyZXVrZW5pYXlvcXl2eWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTkyNDYsImV4cCI6MjEwMzQzNTI0Nn0.J3H9pFK2dc3KOLL8d64a7HEznm-fkJUNZN4YdMu5jD4";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    // 导航
    window.addEventListener('scroll',()=>{
      document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>50);
    });
    function toggleNav(){
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navToggle').classList.toggle('open');
    }

    // 滚动动画
    const observer=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}});
    },{threshold:0.1});
    document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

    // 画廊数据（可通过 Supabase 或本地 JSON 扩展）
    const galleryData=[
      {src:'https://images.unsplash.com/photo-1542362567-07e89096e8f0?w=800&h=500&fit=crop',title:'城市夜景',cat:'scene'},
      {src:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&h=500&fit=crop',title:'超级跑车',cat:'vehicle'},
      {src:'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800&h=500&fit=crop',title:'街头赛车',cat:'vehicle'},
      {src:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&h=500&fit=crop',title:'山脉风光',cat:'scene'},
      {src:'https://images.unsplash.com/photo-1489824904134-891ab64532f1?w=800&h=500&fit=crop',title:'深夜飙车',cat:'roleplay'},
      {src:'https://images.unsplash.com/photo-1504215680853-026ed2a45def?w=800&h=500&fit=crop',title:'经典老爷车',cat:'vehicle'},
    ];

    function renderGallery(filter){
      const grid=document.getElementById('galleryGrid');
      const empty=document.getElementById('galleryEmpty');
      const items=filter==='all'?galleryData:galleryData.filter(i=>i.cat===filter);
      if(!items.length){grid.innerHTML='';grid.appendChild(empty);empty.style.display='';return}
      empty.style.display='none';
      grid.innerHTML=items.map((item,i)=>`
        <div class="gallery-item reveal" onclick="openGalleryModal('${item.src}')" style="transition-delay:${i*0.08}s">
          <img src="${item.src}" alt="${item.title}" loading="lazy">
          <div class="overlay"><span>${item.title}</span></div>
        </div>
      `).join('');
      grid.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
    }

    // 筛选
    document.querySelectorAll('.gallery-filter').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.gallery-filter').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      });
    });

    // 弹窗
    function openGalleryModal(src){
      document.getElementById('galleryModalImg').src=src;
      document.getElementById('galleryModal').classList.add('open');
      document.body.style.overflow='hidden';
    }
    function closeGalleryModal(){
      document.getElementById('galleryModal').classList.remove('open');
      document.body.style.overflow='';
    }
    document.getElementById('galleryModal').addEventListener('click',e=>{
      if(e.target===e.currentTarget)closeGalleryModal();
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGalleryModal()});

    // 初始渲染
    renderGallery('all');

    // 登录状态
    supabaseClient.auth.getSession().then(async({data:{session}})=>{
      const navAuth=document.getElementById('navAuth');
      if(session){
        const{data:p}=await supabaseClient.from('profiles').select('avatar_url,username').eq('id',session.user.id).single();
        const name=(p&&p.username)||'玩家';
        const avatar=p&&p.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        navAuth.innerHTML=`
          <a href="dashboard.html" class="user-badge"><div class="avatar">${avatar}</div><span>${name}</span></a>
          <a href="#" class="nav-btn outline" onclick="logout(event)">退出</a>`;
      }
    });
    async function logout(e){e.preventDefault();await supabaseClient.auth.signOut();location.reload()}
  </script>
  <script src="modal.js"></script>
  <script src="mobile-menu.js"></script>
</body>
