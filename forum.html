<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论坛 - 凌云城</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .forum-page{padding:clamp(4rem,10vh,7rem) clamp(1rem,4vw,4rem) 2rem;max-width:1000px;margin:0 auto}

    .forum-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
    .forum-header h1{font-family:var(--font-heading);font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700}

    .search-box{position:relative;width:100%;max-width:420px}
    .search-box input{
      width:100%;padding:.65rem 1rem .65rem 2.6rem;
      background:var(--surface);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:.88rem;font-family:var(--font-body);
      transition:border-color .2s;
    }
    .search-box input:focus{outline:none;border-color:var(--gold)}
    .search-box input::placeholder{color:var(--text3)}
    .search-box svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
    .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap}
    .tab-btn{
      padding:.5rem 1rem;border-radius:6px;font-size:.82rem;font-weight:500;
      cursor:pointer;transition:all .2s;color:var(--text3);
      border:none;background:none;font-family:var(--font-body);white-space:nowrap;
    }
    .tab-btn:hover{color:var(--text2)}
    .tab-btn.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.2)}

    .btn-new-post{
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.6rem 1.4rem;border-radius:8px;font-size:.85rem;font-weight:600;
      background:var(--gold);color:#000;border:none;cursor:pointer;
      text-decoration:none;transition:all .25s;font-family:var(--font-body);white-space:nowrap;
    }
    .btn-new-post:hover{background:var(--gold2);box-shadow:0 4px 20px rgba(212,168,83,0.35);transform:translateY(-1px)}

    .post-list{display:flex;flex-direction:column;gap:.5rem}

    .post-card{
      display:flex;align-items:center;gap:1rem;
      padding:1rem 1.3rem;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius);
      text-decoration:none;color:inherit;transition:all .25s;
      position:relative;overflow:hidden;
    }
    .post-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,83,0.15),transparent);
      opacity:0;transition:opacity .3s;
    }
    .post-card:hover{border-color:var(--border2);transform:translateX(4px);box-shadow:0 4px 20px rgba(0,0,0,0.2)}
    .post-card:hover::before{opacity:1}

    .post-card.pinned{border-left:3px solid var(--gold)}
    .post-card.featured{border-left:3px solid var(--cyan)}

    .avatar-circle{
      width:42px;height:42px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--font-heading);font-weight:700;font-size:1rem;
      color:#000;overflow:hidden;
    }
    .avatar-circle img{width:100%;height:100%;object-fit:cover}
    .avatar-circle-initial{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
    }

    .post-body{flex:1;min-width:0}
    .post-title-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.25rem}
    .post-title-text{
      font-size:.92rem;font-weight:600;color:var(--text);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    }
    .post-meta{font-size:.78rem;color:var(--text3);display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
    .post-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text3);flex-shrink:0}

    .post-badges{display:flex;align-items:center;gap:.4rem;flex-shrink:0;flex-wrap:wrap}
    .badge-pinned{background:var(--gold-dim);color:var(--gold)}
    .badge-featured{background:var(--cyan-dim);color:var(--cyan)}
    .badge-feedback{background:var(--cyan-dim);color:var(--cyan)}
    .badge-help{background:rgba(248,113,113,0.12);color:var(--red)}
    .badge-suggestion{background:var(--gold-dim);color:var(--gold)}
    .badge-job{background:rgba(52,211,153,0.12);color:#34d399}

    .post-stats{display:flex;align-items:center;gap:1rem;flex-shrink:0}
    .stat-item{display:flex;align-items:center;gap:.3rem;font-size:.78rem;color:var(--text3)}
    .stat-item svg{width:14px;height:14px}

    .load-more-wrap{text-align:center;padding:1.5rem 0}
    .load-more{
      padding:.65rem 2rem;border-radius:8px;font-size:.85rem;font-weight:500;
      background:var(--surface);border:1px solid var(--border);color:var(--text2);
      cursor:pointer;transition:all .2s;font-family:var(--font-body);
    }
    .load-more:hover{border-color:var(--gold);color:var(--gold)}

    .empty-state{text-align:center;padding:4rem 1.5rem;color:var(--text3)}
    .empty-state .icon{font-size:2.5rem;margin-bottom:.8rem;opacity:.5}
    .empty-state p{font-size:.9rem}

    .loading{text-align:center;padding:3rem;color:var(--text3);font-size:.88rem}

    @media(max-width:640px){
      .forum-header{flex-direction:column;align-items:flex-start}
      .search-box{max-width:100%}
      .toolbar{flex-direction:column;align-items:stretch}
      .post-card{padding:.85rem 1rem}
      .post-stats{display:none}
      .post-badges{display:none}
    }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav">
    <a href="index.html" class="nav-logo">凌云城</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">首页</a></li>
      <li><a href="features.html">特色</a></li>

      <li><a href="redeem.html">兑换</a></li>

    </ul>
    <div class="nav-right" id="navAuth">
      <a href="login.html" class="nav-btn outline">登录</a>
      <a href="login.html" class="nav-btn filled">注册</a>
    </div>
    <button class="nav-toggle" id="navToggle" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="forum-page">
    <div class="section-header" style="padding:clamp(2rem,6vh,5rem) 0 clamp(1.5rem,3vh,2.5rem)">
      <h1><span class="art-text">论坛</span></h1>
      <p>分享你的想法，参与社区讨论</p>
    </div>

    <div class="search-box" style="margin-bottom:1.5rem">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索帖子标题..." oninput="applyFilters()">
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-cat="all">全部</button>
        <button class="tab-btn" data-cat="玩家反馈">玩家反馈</button>
        <button class="tab-btn" data-cat="问题求助">问题求助</button>
        <button class="tab-btn" data-cat="建议意见">建议意见</button>
        <button class="tab-btn" data-cat="工作申请">工作申请</button>
      </div>
      <a href="forum-new.html" class="btn-new-post" id="btnNewPost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        发帖
      </a>
    </div>

    <div class="post-list" id="postList">
      <div class="loading">加载中...</div>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more" id="loadMoreBtn" onclick="loadMore()">加载更多</button>
    </div>
  </div>

  <script src="supabase.min.js"></script>
  <script src="utils.js"></script>
  <script>
    const SUPABASE_URL="https://mxajreukeniayoqyvybe.supabase.co";
    const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YWpyZXVrZW5pYXlvcXl2eWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTkyNDYsImV4cCI6MjEwMzQzNTI0Nn0.J3H9pFK2dc3KOLL8d64a7HEznm-fkJUNZN4YdMu5jD4";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    let currentUser=null;
    let allPosts=[];
    let displayedPosts=[];
    let currentFilter='all';
    let postLimit=20;
    let totalCount=0;

    const CATEGORY_BADGE={
      '玩家反馈':'badge-feedback',
      '问题求助':'badge-help',
      '建议意见':'badge-suggestion',
      '工作申请':'badge-job'
    };

    function getInitial(name){
      return name?name.charAt(0).toUpperCase():'?';
    }

    function formatDate(iso){
      const d=new Date(iso);
      const now=new Date();
      const diffMs=now-d;
      const diffMin=Math.floor(diffMs/60000);
      const diffH=Math.floor(diffMs/3600000);
      const diffD=Math.floor(diffMs/86400000);
      if(diffMin<1) return '刚刚';
      if(diffMin<60) return diffMin+'分钟前';
      if(diffH<24) return diffH+'小时前';
      if(diffD<7) return diffD+'天前';
      return d.toLocaleDateString('zh-CN');
    }

    function renderPostCard(p){
      const pinned=p.is_pinned||p.pinned;
      const featured=p.is_featured||p.featured;
      const cls=pinned?'pinned':featured?'featured':'';
      const badgeClass=CATEGORY_BADGE[p.category]||'badge-feedback';
      let badges='';
      if(pinned) badges+='<span class="badge badge-pinned">📌 置顶</span>';
      if(featured) badges+='<span class="badge badge-featured">⭐ 精华</span>';
      badges+='<span class="badge '+badgeClass+'">'+p.category+'</span>';
      const avatarHtml=p.avatar_url
        ?'<img src="'+p.avatar_url+'" alt="">'
        :'<span>'+getInitial(p.username)+'</span>';
      const avatarClass=p.avatar_url?'avatar-circle':'avatar-circle avatar-circle-initial';

      return '<a href="forum-post.html?id='+p.id+'" class="post-card '+cls+'">'+
        '<div class="'+avatarClass+'">'+avatarHtml+'</div>'+
        '<div class="post-body">'+
          '<div class="post-title-row"><span class="post-title-text">'+p.title+'</span></div>'+
          '<div class="post-meta">'+p.username+'<span class="dot"></span>'+formatDate(p.created_at)+'</div>'+
        '</div>'+
        '<div class="post-badges">'+badges+'</div>'+
        '<div class="post-stats">'+
          '<span class="stat-item">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'+
            (p.like_count||0)+
          '</span>'+
          '<span class="stat-item">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+
            (p.comment_count||p.reply_count||0)+
          '</span>'+
        '</div>'+
      '</a>';
    }

    function applyFilters(){
      const query=(document.getElementById('searchInput').value||'').trim().toLowerCase();
      let filtered=allPosts;
      if(currentFilter!=='all'){
        filtered=filtered.filter(function(p){return p.category===currentFilter});
      }
      if(query){
        filtered=filtered.filter(function(p){
          return p.title.toLowerCase().indexOf(query)!==-1;
        });
      }
      displayedPosts=filtered.slice(0,postLimit);
      totalCount=filtered.length;
      renderPosts();
    }

    function renderPosts(){
      const list=document.getElementById('postList');
      if(displayedPosts.length===0){
        const q=document.getElementById('searchInput').value.trim();
        const msg=q?'没有找到匹配的帖子':'暂无帖子，快来发第一个帖子吧！';
        list.innerHTML='<div class="empty-state"><div class="icon">📝</div><p>'+msg+'</p></div>';
        document.getElementById('loadMoreWrap').style.display='none';
        return;
      }
      list.innerHTML=displayedPosts.map(renderPostCard).join('');
      document.getElementById('loadMoreWrap').style.display=totalCount>postLimit?'block':'none';
    }

    function loadMore(){
      postLimit+=20;
      applyFilters();
    }

    function initTabs(){
      document.querySelectorAll('.tab-btn').forEach(function(btn){
        btn.addEventListener('click',function(){
          document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
          btn.classList.add('active');
          currentFilter=btn.dataset.cat;
          postLimit=20;
          applyFilters();
        });
      });
    }

    async function init(){
      initTabs();

      const {data:{session}}=await supabaseClient.auth.getSession();
      const navAuth=document.getElementById('navAuth');
      if(session){
        currentUser=session;
        const{data:p}=await supabaseClient.from('profiles').select('avatar_url,username').eq('id',session.user.id).single();
        const name=(p&&p.username)||'玩家';
        const avatar=p&&p.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        navAuth.innerHTML=
          '<a href="dashboard.html" class="user-badge"><div class="avatar">'+avatar+'</div><span>'+name+'</span></a>'+
          '<a href="#" class="nav-btn outline" onclick="logout(event)">退出</a>';
      }else{
        document.getElementById('btnNewPost').addEventListener('click',function(e){
          e.preventDefault();
          window.location.href='login.html';
        });
      }

      try{
        const{data,error}=await supabaseClient.from('forum_posts')
          .select('*')
          .order('pinned',{ascending:false})
          .order('featured',{ascending:false})
          .order('created_at',{ascending:false})
          .limit(100);
        if(error) throw error;
        allPosts=data||[];
        applyFilters();
      }catch(e){
        console.error('load error:',e);
        document.getElementById('postList').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请刷新重试</p></div>';
      }
    }

    async function logout(e){
      e.preventDefault();
      await supabaseClient.auth.signOut();
      location.reload();
    }

    window.addEventListener('scroll',function(){
      document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>50);
    });
    function toggleNav(){
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navToggle').classList.toggle('open');
    }

    init();
  </script>
  <script src="modal.js"></script>
  <script src="mobile-menu.js"></script>
</body>
</html>
