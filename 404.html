<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 凌云城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #f0f2f5; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
        .error-page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .error-code { font-size: 6rem; font-weight: 800; color: #6366f1; line-height: 1; margin-bottom: 0.5rem; }
        .error-msg { font-size: 1.3rem; color: #555; margin-bottom: 0.5rem; }
        .error-hint { font-size: 0.9rem; color: #999; margin-bottom: 2rem; }
        .error-btn { padding: 0.7rem 2rem; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.15s; }
        .error-btn:hover { background: #5558e6; }
        .error-links { margin-top: 1.5rem; display: flex; gap: 1.5rem; }
        .error-links a { color: #6366f1; font-size: 0.88rem; text-decoration: none; }
        .error-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <div class="error-msg">页面走丢了</div>
        <div class="error-hint">你访问的页面不存在或已被移除</div>
        <a href="index.html" class="error-btn">返回首页</a>
        <div class="error-links">
            <a href="forum.html">论坛</a>
            <a href="connect.html">如何加入</a>
            <a href="redeem.html">兑换码</a>
        </div>
    </div>
</body>
</html>
