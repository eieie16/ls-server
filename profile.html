<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户主页 - 凌云城</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-hero{
      min-height:45vh;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;text-align:center;
      padding:7rem 1.5rem 3rem;
    }
    .page-hero-bg{
      position:absolute;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 20%,rgba(212,168,83,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 75% 70%,rgba(94,234,212,0.04) 0%,transparent 50%);
    }
    .page-hero-content{position:relative;z-index:2;max-width:700px}
    .page-hero h1{
      font-family:var(--font-display);font-size:clamp(2rem,5vw,3.2rem);
      line-height:1.15;margin-bottom:.5rem;
      animation:fadeUp .8s ease .1s both;
    }
    .page-hero h1 .line1{
      display:block;
      background:linear-gradient(135deg,#fff 20%,var(--text2));
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .page-hero h1 .line2{
      display:block;position:relative;
      background:linear-gradient(135deg,var(--gold),var(--gold2),#fff,var(--gold));
      background-size:300% 300%;
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:shimmer 5s ease infinite;
    }
    .page-hero p{
      font-size:clamp(.85rem,1.5vw,1rem);color:var(--text2);
      line-height:1.7;max-width:450px;margin-inline:auto;
      animation:fadeUp .8s ease .25s both;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:translateY(0)}
    }

    .profile-section{
      max-width:800px;margin:0 auto;
      padding:0 clamp(1rem,4vw,4rem) clamp(3rem,6vh,5rem);
    }

    /* Profile Card */
    .profile-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:2rem;overflow:hidden;
      position:relative;
    }
    .profile-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,83,0.3),transparent);
    }
    .profile-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
    .avatar-circle{
      width:80px;height:80px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;font-weight:700;color:#000;
      font-family:var(--font-heading);
      box-shadow:0 4px 20px rgba(212,168,83,0.3);
    }
    .avatar-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover}
    .profile-info{flex:1;min-width:0}
    .profile-info h1{
      font-family:var(--font-heading);font-size:1.4rem;font-weight:700;
      margin-bottom:.3rem;
    }
    .profile-info .role-badge{
      display:inline-block;padding:.2rem .7rem;border-radius:50px;
      font-size:.75rem;font-weight:600;margin-bottom:.3rem;
    }
    .role-badge.admin{background:rgba(248,113,113,0.12);color:var(--red)}
    .role-badge.user{background:var(--gold-dim);color:var(--gold)}
    .profile-info .join-date{font-size:.82rem;color:var(--text3)}
    .profile-actions{display:flex;gap:.5rem;flex-shrink:0}

    /* Level Section */
    .level-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:1.8rem;margin-top:1.2rem;
      position:relative;overflow:hidden;
    }
    .level-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,83,0.3),transparent);
    }
    .level-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .level-badge-wrap{display:flex;align-items:center;gap:1rem}
    .level-icon{
      width:60px;height:60px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      display:flex;align-items:center;justify-content:center;
      font-size:1.5rem;font-weight:900;color:#000;
      font-family:var(--font-heading);
      box-shadow:0 4px 16px rgba(212,168,83,0.3);
    }
    .level-info h3{font-size:1.15rem;font-weight:700;margin-bottom:.15rem}
    .level-info p{color:var(--text2);font-size:.88rem}
    .points-display{text-align:right}
    .points-value{
      font-size:2rem;font-weight:900;color:var(--gold);
      font-family:var(--font-heading);line-height:1;
    }
    .points-label{color:var(--text3);font-size:.78rem;margin-top:.15rem}

    .progress-section{margin-top:1rem}
    .progress-header{
      display:flex;justify-content:space-between;
      margin-bottom:.5rem;font-size:.88rem;color:var(--text2);
    }
    .progress-bar{
      width:100%;height:10px;background:var(--surface2);
      border-radius:5px;overflow:hidden;
    }
    .progress-fill{
      height:100%;border-radius:5px;
      background:linear-gradient(90deg,var(--gold),var(--gold2));
      transition:width .6s cubic-bezier(.4,0,.2,1);
    }

    /* Inventory Section */
    .inventory-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:1.8rem;margin-top:1.2rem;
      position:relative;overflow:hidden;
    }
    .inventory-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(212,168,83,0.3),transparent);
    }
    .inventory-card h2{
      font-size:1rem;font-weight:600;margin-bottom:1rem;
      display:flex;align-items:center;gap:.5rem;
    }
    .inventory-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
    .inventory-item{
      padding:1rem;background:var(--bg2);border:1px solid var(--border);
      border-radius:8px;display:flex;align-items:center;gap:.75rem;
      transition:all .25s;
    }
    .inventory-item:hover{border-color:var(--border2);transform:translateY(-2px)}
    .inventory-item .item-icon{
      width:40px;height:40px;border-radius:8px;
      background:var(--gold-dim);border:1px solid rgba(212,168,83,0.1);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;font-size:1.1rem;
    }
    .inventory-item .item-name{font-size:.88rem;font-weight:500;color:var(--text)}
    .inventory-item .item-meta{font-size:.72rem;color:var(--text3);margin-top:.1rem}

    .empty{text-align:center;padding:2rem;color:var(--text3);font-size:.88rem}

    @media(max-width:600px){
      .profile-header{flex-direction:column;text-align:center}
      .profile-actions{justify-content:center}
      .level-header{flex-direction:column;gap:1rem;text-align:center}
      .points-display{text-align:center}
      .inventory-list{grid-template-columns:1fr}
    }
  </style>
</head>

  <script>
    const SUPABASE_URL="https://mxajreukeniayoqyvybe.supabase.co";
    const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YWpyZXVrZW5pYXlvcXl2eWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTkyNDYsImV4cCI6MjEwMzQzNTI0Nn0.J3H9pFK2dc3KOLL8d64a7HEznm-fkJUNZN4YdMu5jD4";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    const LEVELS=[0,50,150,300,500,800,1200,1800,2500,3500,5000];
    const LEVEL_NAMES=['新手玩家','初级玩家','进阶玩家','资深玩家','精英玩家','社区达人','论坛元老','凌云精英','凌云大师','凌云传奇','凌云之巅'];

    // 粒子系统
    (function(){
      const c=document.getElementById('particles-canvas');
      const ctx=c.getContext('2d');
      let w,h,particles=[];
      function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
      window.addEventListener('resize',resize);resize();
      class Particle{
        constructor(){this.reset()}
        reset(){
          this.x=Math.random()*w;this.y=Math.random()*h;
          this.size=Math.random()*1.5+.5;
          this.speedX=(Math.random()-.5)*.3;this.speedY=(Math.random()-.5)*.3;
          this.opacity=Math.random()*.4+.1;
          this.color=Math.random()>.7?'212,168,83':'255,255,255';
        }
        update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset()}
        draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.opacity})`;ctx.fill()}
      }
      for(let i=0;i<60;i++)particles.push(new Particle());
      function animate(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}
      animate();
    })();

    // 导航滚动
    window.addEventListener('scroll',()=>{
      document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>50);
    });
    function toggleNav(){
      document.getElementById('navLinks').classList.toggle('open');
      document.getElementById('navToggle').classList.toggle('open');
    }

    let currentUser=null;
    let myUserId=null;

    function getLevel(points){
      let level=0;
      for(let i=LEVELS.length-1;i>=0;i--){
        if(points>=LEVELS[i]){level=i;break}
      }
      return level;
    }

    function getLevelProgress(points,level){
      if(level>=LEVELS.length-1)return 100;
      const next=LEVELS[level+1];
      const current=LEVELS[level];
      return((points-current)/(next-current))*100;
    }

    async function init(){
      try{
        const{data:{session}}=await supabaseClient.auth.getSession();
        const navAuth=document.getElementById('navAuth');
        if(session){
          currentUser=session;
          myUserId=session.user.id;
          const{data:p}=await supabaseClient.from('profiles').select('avatar_url,username').eq('id',session.user.id).single();
          const name=(p&&p.username)||'玩家';
          const avatar=p&&p.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
          navAuth.innerHTML=`
            <a href="dashboard.html" class="user-badge"><div class="avatar">${avatar}</div><span>${name}</span></a>
            <a href="#" class="nav-btn outline" onclick="logout(event)">退出</a>`;
        }

        const userId=new URLSearchParams(window.location.search).get('id');
        if(userId){
          await loadProfile(userId);
        }else if(myUserId){
          await loadProfile(myUserId);
        }else{
          document.getElementById('profileArea').innerHTML='<div class="empty">未指定用户</div>';
        }
      }catch(e){console.error('init error:',e)}
    }

    async function loadProfile(userId){
      try{
        const{data:profile}=await supabaseClient.from('profiles').select('*').eq('id',userId).single();
        if(!profile){
          document.getElementById('profileArea').innerHTML='<div class="empty">用户不存在</div>';
          return;
        }

        const{data:stats}=await supabaseClient.from('user_stats')
          .select('*').eq('user_id',userId).single();

        const points=(stats&&stats.points)||0;
        const level=getLevel(points);
        const progress=getLevelProgress(points,level);
        const nextPoints=level<LEVELS.length-1?LEVELS[level+1]:LEVELS[level];
        const levelName=LEVEL_NAMES[level]||'新手玩家';
        const isOwnProfile=myUserId===userId;
        const role=profile.role||'user';

        const initial=(profile.username||'?')[0].toUpperCase();
        const avatarHtml=profile.avatar_url
          ?`<img src="${profile.avatar_url}">`
          :initial;
        const joinDate=new Date(profile.created_at).toLocaleDateString('zh-CN');

        document.title=profile.username+' - 凌云城';

        document.getElementById('profileArea').innerHTML=`
          <div class="profile-card">
            <div class="profile-header">
              <div class="avatar-circle">${avatarHtml}</div>
              <div class="profile-info">
                <h1>${profile.username}</h1>
                <span class="role-badge ${role}">${role==='admin'?'管理员':'玩家'}</span>
                <div class="join-date">加入于 ${joinDate}</div>
              </div>
              ${isOwnProfile?`<div class="profile-actions">
                <a href="dashboard.html" class="btn btn-ghost" style="font-size:.82rem;padding:.5rem 1rem">编辑资料</a>
              </div>`:''}
            </div>
          </div>

          <div class="level-card">
            <div class="level-header">
              <div class="level-badge-wrap">
                <div class="level-icon">${level+1}</div>
                <div class="level-info">
                  <h3>${levelName}</h3>
                  <p>等级 ${level+1}</p>
                </div>
              </div>
              <div class="points-display">
                <div class="points-value">${points}</div>
                <div class="points-label">积分</div>
              </div>
            </div>
            <div class="progress-section">
              <div class="progress-header">
                <span>升级进度</span>
                <span>${points} / ${nextPoints}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${progress}%"></div>
              </div>
            </div>
          </div>

          <div class="inventory-card">
            <h2>🎁 兑换记录</h2>
            <div id="inventoryList"><div class="empty">加载中...</div></div>
          </div>
        `;

        await loadInventory(userId);
      }catch(e){
        console.error('load profile error:',e);
        document.getElementById('profileArea').innerHTML='<div class="empty">加载失败，请刷新重试</div>';
      }
    }

    async function loadInventory(userId){
      try{
        const{data}=await supabaseClient.from('redeem_logs')
          .select('*').eq('user_id',userId).order('created_at',{ascending:false});

        const container=document.getElementById('inventoryList');
        const items=data||[];
        if(items.length===0){
          container.innerHTML='<div class="empty">暂无物品</div>';
          return;
        }
        container.innerHTML=`<div class="inventory-list">${items.map(item=>{
          const t=new Date(item.created_at).toLocaleDateString('zh-CN');
          return`<div class="inventory-item">
            <div class="item-icon">🎁</div>
            <div>
              <div class="item-name">${item.prize||item.code}</div>
              <div class="item-meta">${t}</div>
            </div>
          </div>`;
        }).join('')}</div>`;
      }catch(e){
        console.error('load inventory error:',e);
        document.getElementById('inventoryList').innerHTML='<div class="empty">加载失败</div>';
      }
    }

    async function logout(e){
      e.preventDefault();
      await supabaseClient.auth.signOut();
      location.reload();
    }

    init();
  </script>
  <script src="modal.js"></script>
  <script src="mobile-menu.js"></script>
</body>
