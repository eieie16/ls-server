<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户面板 - 凌云城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d0d0d; --card: #1a1a1a; --accent: #e8a87c;
            --text: #f5f5f5; --text2: #a0a0a0; --border: #2a2a2a;
            --success: #51cf66; --warning: #ffd43b; --danger: #ff6b6b;
        }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); }
        
        nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            padding: 0 4rem; height: 72px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(13,13,13,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 0.1em; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--accent); display: flex; align-items: center;
            justify-content: center; font-weight: 600; color: var(--bg); font-size: 0.9rem;
        }
        .user-name { font-size: 0.9rem; }
        .user-role {
            font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px;
            background: rgba(232,168,124,0.2); color: var(--accent);
        }
        .btn-logout {
            padding: 0.5rem 1rem; background: transparent; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text2); font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
        
        main { padding: 100px 2rem 4rem; max-width: 1000px; margin: 0 auto; }
        
        .welcome-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 2.5rem; margin-bottom: 2rem;
        }
        .welcome-card h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .welcome-card p { color: var(--text2); }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.5rem; text-align: center;
        }
        .stat-card .value { font-size: 2rem; font-weight: 600; color: var(--accent); }
        .stat-card .label { font-size: 0.85rem; color: var(--text2); margin-top: 0.5rem; }
        
        .action-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;
        }
        .action-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 2rem; text-align: center;
            cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit;
        }
        .action-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .action-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .action-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .action-card p { font-size: 0.85rem; color: var(--text2); }
        
        .admin-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
            color: var(--danger); padding: 0.75rem 1.25rem; border-radius: 8px;
            margin-top: 2rem; font-size: 0.9rem;
        }
        .admin-badge a { color: var(--danger); text-decoration: underline; }
        
        .loading { text-align: center; padding: 4rem; color: var(--text2); }
        
        @media (max-width: 768px) {
            nav { padding: 0 1.5rem; }
            .stats-grid, .action-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">凌云城</div>
        <div class="nav-right">
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <span class="user-name" id="userName">加载中...</span>
                <span class="user-role" id="userRole">用户</span>
            </div>
            <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
    </nav>

    <main id="mainContent">
        <div class="loading">加载中...</div>
    </main>

    <!-- Supabase SDK -->
    <script src="supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://mxajreukeniayoqyvybe.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YWpyZXVrZW5pYXlvcXl2eWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTkyNDYsImV4cCI6MjEwMzQzNTI0Nn0.J3H9pFK2dc3KOLL8d64a7HEznm-fkJUNZN4YdMu5jD4";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 检查登录状态
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // 获取用户资料
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            const fallbackProfile = {
                username: session.user.email,
                role: 'user',
                play_time: 0,
                jobs: 0,
                cars: 0
            };

            renderDashboard(session.user, profile || fallbackProfile);
        }

        function renderDashboard(user, data) {
            const initials = (data.username || user.email || '?').substring(0, 2).toUpperCase();
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('userName').textContent = data.username || user.email;
            document.getElementById('userRole').textContent = data.role === 'admin' ? '管理员' : '玩家';
            document.getElementById('userRole').style.background = data.role === 'admin' ? 'rgba(255,107,107,0.2)' : 'rgba(232,168,124,0.2)';
            document.getElementById('userRole').style.color = data.role === 'admin' ? '#ff6b6b' : '#e8a87c';

            let adminSection = '';
            if (data.role === 'admin') {
                adminSection = `
                    <div class="admin-badge">
                        <span>🔐</span>
                        <span>您是管理员 | <a href="admin.html">进入管理后台</a></span>
                    </div>
                `;
            }

            document.getElementById('mainContent').innerHTML = `
                <div class="welcome-card">
                    <h1>欢迎回来，${data.username || '玩家'}！</h1>
                    <p>感谢您加入凌云城-轻RP 4.0，祝您游戏愉快。</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="value">${data.play_time || 0}</div>
                        <div class="label">游戏时长 (小时)</div>
                    </div>
                    <div class="stat-card">
                        <div class="value">${data.jobs || 0}</div>
                        <div class="label">职业数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="value">${data.cars || 0}</div>
                        <div class="label">拥有车辆</div>
                    </div>
                </div>
                
                <div class="action-grid">
                    <a href="index.html" class="action-card">
                        <div class="icon">🏠</div>
                        <h3>返回首页</h3>
                        <p>查看服务器信息和特色</p>
                    </a>
                    <a href="connect.html" class="action-card">
                        <div class="icon">🎮</div>
                        <h3>开始游戏</h3>
                        <p>连接服务器地址</p>
                    </a>
                    <a href="https://kook.vip/71Hw5z" target="_blank" class="action-card">
                        <div class="icon">💬</div>
                        <h3>Kook 社区</h3>
                        <p>加入我们的讨论群</p>
                    </a>
                    <a href="https://qm.qq.com/q/zzUzFa6ytw" target="_blank" class="action-card">
                        <div class="icon">📱</div>
                        <h3>QQ 群</h3>
                        <p>加入 QQ 交流群</p>
                    </a>
                </div>
                
                ${adminSection}
            `;
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>
</html>
