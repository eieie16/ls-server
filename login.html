<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 凌云城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d0d0d; --card: #1a1a1a; --accent: #e8a87c;
            --text: #f5f5f5; --text2: #a0a0a0; --border: #2a2a2a;
        }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-container { width: 100%; max-width: 420px; padding: 2rem; }
        .auth-box {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 2.5rem;
        }
        .logo { text-align: center; font-size: 1.5rem; font-weight: 600; color: var(--accent); margin-bottom: 2rem; letter-spacing: 0.1em; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 2rem; background: var(--bg); border-radius: 10px; padding: 4px; }
        .auth-tab {
            flex: 1; padding: 0.75rem; text-align: center; cursor: pointer;
            border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; color: var(--text2);
        }
        .auth-tab.active { background: var(--accent); color: var(--bg); }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text2); margin-bottom: 0.5rem; }
        .form-group input {
            width: 100%; padding: 0.875rem 1rem; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
            font-size: 0.95rem; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        
        .btn-primary {
            width: 100%; padding: 0.875rem; background: var(--accent);
            border: none; border-radius: 8px; color: var(--bg);
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text2); font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        
        .btn-google {
            width: 100%; padding: 0.875rem; background: transparent;
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
            font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.75rem;
        }
        .btn-google:hover { border-color: var(--text2); background: rgba(255,255,255,0.03); }
        
        .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
        .success-msg { color: #51cf66; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
        
        .hidden { display: none !important; }
        
        .back-link { text-align: center; margin-top: 1.5rem; }
        .back-link a { color: var(--text2); font-size: 0.85rem; text-decoration: none; }
        .back-link a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">凌云城</div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">登录</div>
                <div class="auth-tab" onclick="switchTab('register')">注册</div>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码" required>
                </div>
                <div class="error-msg" id="loginError"></div>
                <button type="submit" class="btn-primary" id="loginBtn">登录</button>
            </form>
            
            <!-- Register Form -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="选择用户名" required minlength="3" maxlength="20">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="再次输入密码" required>
                </div>
                <div class="error-msg" id="regError"></div>
                <div class="success-msg" id="regSuccess"></div>
                <button type="submit" class="btn-primary" id="regBtn">注册</button>
            </form>
            
            <div class="divider">或</div>
            
            <button class="btn-google" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.704H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.425 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.169 6.656 3.58 9 3.58Z"/>
                </svg>
                使用 Google 登录
            </button>
            
            <div class="back-link"><a href="index.html">← 返回首页</a></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        // 请在下方填入你的 Firebase 配置（从 Firebase Console 获取）
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
            clearMessages();
        }

        function clearMessages() {
            document.querySelectorAll('.error-msg, .success-msg').forEach(el => el.style.display = 'none');
        }

        function showError(el, msg) {
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showSuccess(el, msg) {
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.style.display = 'none';
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                showError(errorEl, getErrorMessage(err.code));
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('regBtn');
            const errorEl = document.getElementById('regError');
            const successEl = document.getElementById('regSuccess');
            
            if (password !== confirmPassword) {
                showError(errorEl, '两次输入的密码不一致');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '注册中...';
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                // 保存用户信息到 Firestore
                await firebase.firestore().collection('users').doc(cred.user.uid).set({
                    username: username,
                    email: email,
                    role: 'user',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showSuccess(successEl, '注册成功！正在跳转...');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (err) {
                showError(errorEl, getErrorMessage(err.code));
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }

        async function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                // 检查用户是否已注册
                const userDoc = await firebase.firestore().collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    await firebase.firestore().collection('users').doc(result.user.uid).set({
                        username: result.user.displayName || result.user.email.split('@')[0],
                        email: result.user.email,
                        role: 'user',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                window.location.href = 'index.html';
            } catch (err) {
                alert(getErrorMessage(err.code));
            }
        }

        function getErrorMessage(code) {
            const messages = {
                'auth/email-already-in-use': '该邮箱已被注册',
                'auth/invalid-email': '邮箱格式不正确',
                'auth/operation-not-allowed': '请检查 Firebase 配置',
                'auth/weak-password': '密码长度至少6位',
                'auth/user-not-found': '该邮箱未注册',
                'auth/wrong-password': '密码错误',
                'auth/network-request-failed': '网络连接失败',
                'auth/too-many-requests': '请求过于频繁，请稍后再试'
            };
            return messages[code] || '操作失败，请稍后重试';
        }

        // 检查是否已登录
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'index.html';
        });
    </script>
</body>
</html>
